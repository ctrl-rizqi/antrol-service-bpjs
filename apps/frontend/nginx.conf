server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Kompresi Gzip untuk mempercepat load
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Konfigurasi SPA: Semua request yang tidak ditemukan file-nya diarahkan ke index.html
    # Ini penting agar routing React (react-router) berfungsi saat refresh page
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache control untuk static assets (JS/CSS/Images)
    # Vite menghasilkan nama file dengan hash, jadi aman untuk di-cache lama (1 tahun)
    location ~* \.(?:css|js|jpg|svg|png|gif|ico|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Error page default Nginx
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}