services:
  mysql:
    image: mysql:8.0
    container_name: antrol-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: antrol_service
      MYSQL_USER: antrol
      MYSQL_PASSWORD: antrol123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - antrol-network

  backend:
    build:
      context: .
      dockerfile: apps/service/Dockerfile.backend
      target: production
    container_name: antrol-backend
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./apps/service/prisma:/app/prisma
    networks:
      - antrol-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.frontend
      target: production
    container_name: antrol-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - antrol-network

networks:
  antrol-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local